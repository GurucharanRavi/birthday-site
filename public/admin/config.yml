backend:
  name: git-gateway
  branch: main

# cms_config_version: 3 — bump when admin fields change (ignore this line)

# Opens your live site from the Admin toolbar (Preview). Update if your URL changes.
site_url: https://hbdrrs.netlify.app
display_url: https://hbdrrs.netlify.app
show_preview_links: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: "Site · look & feel"
    files:
      - label: Global settings
        name: global
        file: content/settings.json
        fields:
          - {
              label: Intro title,
              name: introTitle,
              widget: string,
              required: false,
              hint: "Leave blank to hide. After Publish, use Preview in the Admin toolbar to see the live site.",
            }
          - {
              label: Intro subtitle,
              name: introSubtitle,
              widget: string,
              required: false,
              hint: "Leave blank to hide.",
            }
          - {
              label: Intro duration (milliseconds),
              name: introDurationMs,
              widget: number,
              value_type: int,
              min: 1500,
              max: 12000,
              step: 100,
            }
          - label: Intro motion style
            name: introAnimation
            widget: select
            options:
              - { label: Fade + gentle scale, value: fade-scale }
              - { label: Fade only, value: fade }
              - { label: Slide up, value: slide-up }
          - label: Intro exit (after opening)
            name: introExitAnimation
            widget: select
            options:
              - { label: Fade out, value: fade }
              - { label: Fade + slight zoom, value: fade-scale }
              - { label: Slide down + fade, value: slide-down }
              - { label: Instant (no exit), value: none }
          - {
              label: Intro exit duration (milliseconds),
              name: introExitDurationMs,
              widget: number,
              value_type: int,
              min: 200,
              max: 3000,
              step: 50,
            }
          - { label: Confetti during intro, name: confettiEnabled, widget: boolean }
          - label: Confetti amount
            name: confettiIntensity
            widget: select
            options:
              - { label: Light, value: light }
              - { label: Medium, value: medium }
              - { label: Heavy, value: heavy }
          - label: Font · intro title
            name: fontIntroTitle
            widget: select
            options:
              - {
                  label: Playfair Display,
                  value: "'Playfair Display', Georgia, serif",
                }
              - {
                  label: Fraunces,
                  value: "'Fraunces', 'Palatino Linotype', serif",
                }
              - { label: Cormorant Garamond, value: "'Cormorant Garamond', Georgia, serif" }
              - { label: Libre Baskerville, value: "'Libre Baskerville', Georgia, serif" }
              - { label: Lora, value: "'Lora', Georgia, serif" }
              - { label: Great Vibes (script), value: "'Great Vibes', cursive" }
              - { label: Pacifico (script), value: "'Pacifico', cursive" }
              - { label: Poppins, value: "'Poppins', system-ui, sans-serif" }
              - { label: Montserrat, value: "'Montserrat', system-ui, sans-serif" }
              - { label: DM Sans, value: "'DM Sans', system-ui, sans-serif" }
              - { label: Raleway, value: "'Raleway', system-ui, sans-serif" }
              - { label: Oswald, value: "'Oswald', system-ui, sans-serif" }
              - { label: Georgia, value: "Georgia, serif" }
              - { label: System UI, value: "system-ui, sans-serif" }
          - {
              label: Custom font · intro title (overrides dropdown),
              name: fontIntroTitleCustom,
              widget: string,
              required: false,
              hint: "Paste any CSS font-family, e.g. 'My Font', sans-serif",
            }
          - label: Font · intro subtitle
            name: fontIntroSubtitle
            widget: select
            options:
              - {
                  label: Playfair Display,
                  value: "'Playfair Display', Georgia, serif",
                }
              - {
                  label: Fraunces,
                  value: "'Fraunces', 'Palatino Linotype', serif",
                }
              - { label: Cormorant Garamond, value: "'Cormorant Garamond', Georgia, serif" }
              - { label: Libre Baskerville, value: "'Libre Baskerville', Georgia, serif" }
              - { label: Lora, value: "'Lora', Georgia, serif" }
              - { label: Great Vibes (script), value: "'Great Vibes', cursive" }
              - { label: Pacifico (script), value: "'Pacifico', cursive" }
              - { label: Poppins, value: "'Poppins', system-ui, sans-serif" }
              - { label: Montserrat, value: "'Montserrat', system-ui, sans-serif" }
              - { label: DM Sans, value: "'DM Sans', system-ui, sans-serif" }
              - { label: Raleway, value: "'Raleway', system-ui, sans-serif" }
              - { label: Oswald, value: "'Oswald', system-ui, sans-serif" }
              - { label: Georgia, value: "Georgia, serif" }
              - { label: System UI, value: "system-ui, sans-serif" }
          - {
              label: Custom font · intro subtitle,
              name: fontIntroSubtitleCustom,
              widget: string,
              required: false,
            }

          - { label: Background image, name: backgroundImage, widget: image, required: false }
          - {
              label: Background focus horizontal (%),
              name: backgroundPositionX,
              widget: number,
              value_type: int,
              min: 0,
              max: 100,
              step: 1,
              hint: "Which part of the photo is centered (left 0 → right 100).",
            }
          - {
              label: Background focus vertical (%),
              name: backgroundPositionY,
              widget: number,
              value_type: int,
              min: 0,
              max: 100,
              step: 1,
            }
          - {
              label: Background blur (px),
              name: backgroundBlurPx,
              widget: number,
              value_type: int,
              min: 0,
              max: 24,
              step: 1,
            }
          - {
              label: Dark overlay (CSS rgba),
              name: overlayTint,
              widget: string,
              required: false,
            }

          - {
              label: Section title,
              name: friendsPageTitle,
              widget: string,
              required: false,
              hint: "Leave blank to hide.",
            }
          - {
              label: Section hint / subtitle,
              name: friendsPageHint,
              widget: string,
              required: false,
              hint: "Leave blank to hide.",
            }
          - label: Font · friends section title
            name: fontFriendsTitle
            widget: select
            options:
              - {
                  label: Playfair Display,
                  value: "'Playfair Display', Georgia, serif",
                }
              - {
                  label: Fraunces,
                  value: "'Fraunces', 'Palatino Linotype', serif",
                }
              - { label: Cormorant Garamond, value: "'Cormorant Garamond', Georgia, serif" }
              - { label: Libre Baskerville, value: "'Libre Baskerville', Georgia, serif" }
              - { label: Lora, value: "'Lora', Georgia, serif" }
              - { label: Great Vibes (script), value: "'Great Vibes', cursive" }
              - { label: Pacifico (script), value: "'Pacifico', cursive" }
              - { label: Poppins, value: "'Poppins', system-ui, sans-serif" }
              - { label: Montserrat, value: "'Montserrat', system-ui, sans-serif" }
              - { label: DM Sans, value: "'DM Sans', system-ui, sans-serif" }
              - { label: Raleway, value: "'Raleway', system-ui, sans-serif" }
              - { label: Oswald, value: "'Oswald', system-ui, sans-serif" }
              - { label: Georgia, value: "Georgia, serif" }
              - { label: System UI, value: "system-ui, sans-serif" }
          - {
              label: Custom font · friends title,
              name: fontFriendsTitleCustom,
              widget: string,
              required: false,
            }
          - label: Font · friends hint
            name: fontFriendsHint
            widget: select
            options:
              - {
                  label: Playfair Display,
                  value: "'Playfair Display', Georgia, serif",
                }
              - {
                  label: Fraunces,
                  value: "'Fraunces', 'Palatino Linotype', serif",
                }
              - { label: Cormorant Garamond, value: "'Cormorant Garamond', Georgia, serif" }
              - { label: Libre Baskerville, value: "'Libre Baskerville', Georgia, serif" }
              - { label: Lora, value: "'Lora', Georgia, serif" }
              - { label: Great Vibes (script), value: "'Great Vibes', cursive" }
              - { label: Pacifico (script), value: "'Pacifico', cursive" }
              - { label: Poppins, value: "'Poppins', system-ui, sans-serif" }
              - { label: Montserrat, value: "'Montserrat', system-ui, sans-serif" }
              - { label: DM Sans, value: "'DM Sans', system-ui, sans-serif" }
              - { label: Raleway, value: "'Raleway', system-ui, sans-serif" }
              - { label: Oswald, value: "'Oswald', system-ui, sans-serif" }
              - { label: Georgia, value: "Georgia, serif" }
              - { label: System UI, value: "system-ui, sans-serif" }
          - {
              label: Custom font · friends hint,
              name: fontFriendsHintCustom,
              widget: string,
              required: false,
            }
          - label: Face arrangement
            name: friendsLayout
            widget: select
            hint: "Pentagon and ring need exactly 5 friends."
            options:
              - {
                  label: Auto row (fits all on one line when possible — recommended),
                  value: wrap,
                }
              - {
                  label: Single row (always one line, scroll on small phones),
                  value: row,
                }
              - { label: Vertical stack, value: column }
              - { label: Pentagon (5 friends), value: pentagon-up }
              - { label: Pentagon upside-down (5 friends), value: pentagon-down }
              - { label: Circle ring (5 friends), value: ring }
          - label: Face size
            name: avatarSizePreset
            widget: select
            options:
              - { label: Small, value: sm }
              - { label: Medium, value: md }
              - { label: Large, value: lg }
              - { label: Extra large, value: xl }
              - { label: Extra extra large (~196px), value: xxl }
              - { label: Custom (use px field below), value: custom }
          - {
              label: Custom face size (px),
              name: avatarSizePx,
              widget: number,
              value_type: int,
              min: 56,
              max: 220,
              step: 4,
              hint: "Only used when Face size is Custom.",
            }
          - label: Space between faces
            name: friendsGapPreset
            widget: select
            options:
              - { label: Cozy, value: cozy }
              - { label: Normal, value: normal }
              - { label: Roomy, value: roomy }
              - { label: Custom (use px field below), value: custom }
          - {
              label: Custom gap (px),
              name: gridGapPx,
              widget: number,
              value_type: int,
              min: 0,
              max: 64,
              step: 2,
              hint: "Only used when Space between faces is Custom.",
            }
          - label: How wide the group spreads
            name: friendsSpread
            widget: select
            hint: "Auto = wide enough for every face on one row. Full = stretch across entire screen."
            options:
              - { label: Auto (recommended), value: auto }
              - { label: Full screen width, value: full }
          - {
              label: Push faces down the page,
              name: friendsOffsetYVh,
              widget: number,
              value_type: int,
              min: 0,
              max: 40,
              step: 1,
              hint: "0 = centered vertically. Try 8–15 to move lower.",
            }
          - { label: Avatar ring color, name: avatarRingColor, widget: string, required: false }

          - label: Font · modal name
            name: fontModalTitle
            widget: select
            options:
              - {
                  label: Playfair Display,
                  value: "'Playfair Display', Georgia, serif",
                }
              - {
                  label: Fraunces,
                  value: "'Fraunces', 'Palatino Linotype', serif",
                }
              - { label: Cormorant Garamond, value: "'Cormorant Garamond', Georgia, serif" }
              - { label: Libre Baskerville, value: "'Libre Baskerville', Georgia, serif" }
              - { label: Lora, value: "'Lora', Georgia, serif" }
              - { label: Great Vibes (script), value: "'Great Vibes', cursive" }
              - { label: Pacifico (script), value: "'Pacifico', cursive" }
              - { label: Poppins, value: "'Poppins', system-ui, sans-serif" }
              - { label: Montserrat, value: "'Montserrat', system-ui, sans-serif" }
              - { label: DM Sans, value: "'DM Sans', system-ui, sans-serif" }
              - { label: Raleway, value: "'Raleway', system-ui, sans-serif" }
              - { label: Oswald, value: "'Oswald', system-ui, sans-serif" }
              - { label: Georgia, value: "Georgia, serif" }
              - { label: System UI, value: "system-ui, sans-serif" }
          - {
              label: Custom font · modal name,
              name: fontModalTitleCustom,
              widget: string,
              required: false,
            }
          - label: Font · modal note
            name: fontModalNote
            widget: select
            options:
              - {
                  label: Playfair Display,
                  value: "'Playfair Display', Georgia, serif",
                }
              - {
                  label: Fraunces,
                  value: "'Fraunces', 'Palatino Linotype', serif",
                }
              - { label: Cormorant Garamond, value: "'Cormorant Garamond', Georgia, serif" }
              - { label: Libre Baskerville, value: "'Libre Baskerville', Georgia, serif" }
              - { label: Lora, value: "'Lora', Georgia, serif" }
              - { label: Great Vibes (script), value: "'Great Vibes', cursive" }
              - { label: Pacifico (script), value: "'Pacifico', cursive" }
              - { label: Poppins, value: "'Poppins', system-ui, sans-serif" }
              - { label: Montserrat, value: "'Montserrat', system-ui, sans-serif" }
              - { label: DM Sans, value: "'DM Sans', system-ui, sans-serif" }
              - { label: Raleway, value: "'Raleway', system-ui, sans-serif" }
              - { label: Oswald, value: "'Oswald', system-ui, sans-serif" }
              - { label: Georgia, value: "Georgia, serif" }
              - { label: System UI, value: "system-ui, sans-serif" }
          - {
              label: Custom font · modal note,
              name: fontModalNoteCustom,
              widget: string,
              required: false,
            }
          - label: Font · song title / artist
            name: fontModalTrack
            widget: select
            options:
              - {
                  label: Playfair Display,
                  value: "'Playfair Display', Georgia, serif",
                }
              - {
                  label: Fraunces,
                  value: "'Fraunces', 'Palatino Linotype', serif",
                }
              - { label: Cormorant Garamond, value: "'Cormorant Garamond', Georgia, serif" }
              - { label: Libre Baskerville, value: "'Libre Baskerville', Georgia, serif" }
              - { label: Lora, value: "'Lora', Georgia, serif" }
              - { label: Great Vibes (script), value: "'Great Vibes', cursive" }
              - { label: Pacifico (script), value: "'Pacifico', cursive" }
              - { label: Poppins, value: "'Poppins', system-ui, sans-serif" }
              - { label: Montserrat, value: "'Montserrat', system-ui, sans-serif" }
              - { label: DM Sans, value: "'DM Sans', system-ui, sans-serif" }
              - { label: Raleway, value: "'Raleway', system-ui, sans-serif" }
              - { label: Oswald, value: "'Oswald', system-ui, sans-serif" }
              - { label: Georgia, value: "Georgia, serif" }
              - { label: System UI, value: "system-ui, sans-serif" }
          - {
              label: Custom font · song info,
              name: fontModalTrackCustom,
              widget: string,
              required: false,
            }
          - { label: Modal frosted blur, name: modalBackdropBlur, widget: boolean }
          - label: Modal style
            name: modalStyle
            widget: select
            options:
              - { label: Glass, value: glass }
              - { label: Solid, value: solid }
          - {
              label: Vinyl spin (seconds per rotation),
              name: vinylSpinDurationSec,
              widget: number,
              value_type: float,
              min: 1,
              max: 12,
              step: 0.25,
            }
          - { label: Vinyl idle pulse, name: vinylIdlePulse, widget: boolean }

          - {
              label: Browser tab title,
              name: documentTitle,
              widget: string,
              required: false,
            }
          - { label: Accent color, name: accentColor, widget: string, required: false }
          - { label: Second accent, name: accentColor2, widget: string, required: false }
          - { label: Modal surface tint, name: surfaceColor, widget: string, required: false }
          - { label: Text on modal, name: textOnSurface, widget: string, required: false }

  - name: friends
    label: Friends
    folder: content/friends
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    identifier_field: slug
    summary: "{{name}} · order {{order}}"
    fields:
      - { label: Display name, name: name, widget: string, required: false }
      - { label: URL slug, name: slug, widget: string, hint: "e.g. alex" }
      - {
          label: Order (1 = first),
          name: order,
          widget: number,
          value_type: int,
          min: 1,
          max: 10,
          step: 1,
        }
      - { label: Face photo, name: photo, widget: image, required: false }
      - {
          label: Face crop focus · horizontal (%),
          name: photoFocusX,
          widget: number,
          value_type: int,
          min: 0,
          max: 100,
          default: 50,
          hint: "Pan photo inside the circle: 0=left, 100=right.",
        }
      - {
          label: Face crop focus · vertical (%),
          name: photoFocusY,
          widget: number,
          value_type: int,
          min: 0,
          max: 100,
          default: 50,
        }
      - {
          label: Personal note,
          name: note,
          widget: text,
          required: false,
          hint: "Leave blank to hide in pop-up.",
        }
      - { label: Show name in pop-up, name: showNameInModal, widget: boolean, default: true }
      - { label: Song file (MP3), name: song, widget: file, required: false }
      - {
          label: Song title,
          name: songTitle,
          widget: string,
          required: false,
        }
      - { label: Artist, name: songArtist, widget: string, required: false }
      - { label: Disc label image, name: discImage, widget: image, required: false }
      - {
          label: Disc image focus · horizontal (%),
          name: discFocusX,
          widget: number,
          value_type: int,
          min: 0,
          max: 100,
          default: 50,
        }
      - {
          label: Disc image focus · vertical (%),
          name: discFocusY,
          widget: number,
          value_type: int,
          min: 0,
          max: 100,
          default: 50,
        }
