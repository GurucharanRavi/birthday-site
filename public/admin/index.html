<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Birthday · Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      function loadDecap() {
        if (document.querySelector('script[data-decap]')) return;
        var s = document.createElement("script");
        s.src = "https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js";
        s.setAttribute("data-decap", "true");
        document.body.appendChild(s);
      }

      function onIdentityReady(user) {
        var hash = window.location.hash || "";
        var hasToken =
          hash.indexOf("recovery_token=") !== -1 ||
          hash.indexOf("invite_token=") !== -1 ||
          hash.indexOf("confirmation_token=") !== -1;

        if (user) {
          loadDecap();
          return;
        }

        if (hasToken) {
          window.netlifyIdentity.open("login");
        } else {
          window.netlifyIdentity.open("login");
        }

        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }

      function bindIdentity() {
        if (!window.netlifyIdentity) return;
        window.netlifyIdentity.on("init", onIdentityReady);
      }

      bindIdentity();
    </script>
  </body>
</html>
