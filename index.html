<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;0,700&family=Montserrat:wght@500;600;700&family=Oswald:wght@500;600&family=Pacifico&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@400;600&family=Raleway:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Birthday</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          var hash = window.location.hash || "";
          if (
            !user &&
            (hash.indexOf("recovery_token=") !== -1 ||
              hash.indexOf("invite_token=") !== -1 ||
              hash.indexOf("confirmation_token=") !== -1)
          ) {
            window.netlifyIdentity.open("login");
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
